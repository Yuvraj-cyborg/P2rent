name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds and checks every binary without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link against glibc 2.17 so that one binary runs on
          # any mainstream distribution from the last decade, not only on
          # systems as new as the build runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: p2rent-x86_64-linux
            glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: p2rent-aarch64-linux
            glibc: "2.17"
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: p2rent-x86_64-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: p2rent-aarch64-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: p2rent-x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cargo-zigbuild links with zig, which can target an old glibc.
      - uses: mlugg/setup-zig@v2
        if: matrix.glibc

      - uses: taiki-e/install-action@v2
        if: matrix.glibc
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --locked -p p2rent --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --release --locked -p p2rent --target "${{ matrix.target }}"
          fi

      - name: Check the binary starts
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/p2rent
          if [ -f "$bin.exe" ]; then bin=$bin.exe; fi
          "$bin" --version

      - name: Transfer a file on a glibc ${{ matrix.glibc }} system
        if: matrix.glibc
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/w:ro" centos:7 sh -euc '
            head -c 50000000 /dev/urandom > /tmp/data
            /w/p2rent --key /tmp/a.key seed /tmp/data --listen 127.0.0.1:4433 > /tmp/ticket &
            for _ in $(seq 100); do [ -s /tmp/ticket ] && break; sleep 0.2; done
            /w/p2rent --key /tmp/b.key get "$(cat /tmp/ticket)" --out /tmp/out
            [ "$(sha256sum < /tmp/data)" = "$(sha256sum < /tmp/out/data)" ]
            echo "transfer ok on $(ldd --version | head -n 1)"
          '

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f p2rent.exe ]; then binary=p2rent.exe; else binary=p2rent; fi
          tar czf "../../../${{ matrix.artifact }}.tar.gz" "$binary" -C ../../.. LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz > checksums-sha256.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums-sha256.txt
