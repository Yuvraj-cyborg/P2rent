name: Bench

# A timed transfer over loopback, once a night. The figures move with the
# machine, so they are a record to look back on and not a gate: each run
# keeps its output as an artifact. docs/performance.md says how to read it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --package benches --bench transfer | tee transfer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-${{ github.sha }}
          path: transfer.txt
          retention-days: 90
