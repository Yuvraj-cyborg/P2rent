name = "mux-proofs"
defaultTargets = ["Model"]

# The Lean library that Aeneas's output is written against. Its revision is
# the Aeneas release that produced the code in Model/: change both
# together (see README.md).
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "1dc8ad31b1b062a77c50e29144a6c7bba955fa09"
subDir = "backends/lean"

[[lean_lib]]
name = "Model"
# A warning fails the build. In particular a proof left unfinished with
# `sorry` is only a warning by default.
moreLeanArgs = ["-DwarningAsError=true"]
