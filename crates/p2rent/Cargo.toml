[package]
name = "p2rent"
description = "Swarm distribution of large artifacts over QUIC"
readme = "../../README.md"
keywords = ["p2p", "quic", "swarm", "blake3", "file-transfer"]
categories = ["command-line-utilities", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["fast-apple-datapath"]
# See `p2rent-peer` for what this does.
fast-apple-datapath = ["p2rent-peer/fast-apple-datapath"]

[dependencies]
p2rent-core.workspace = true
p2rent-fs.workspace = true
p2rent-peer.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
