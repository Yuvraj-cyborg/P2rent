[package]
name = "engine"
description = "Runs a mux transfer: the tasks, locks and timers around the logic in `model`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The checks every place must pass, and a place held in memory to run them
# on. For the tests of crates that implement a place.
conformance = []

[dependencies]
model.workspace = true
blake3.workspace = true
# Already shipped, as the TLS library's own: SHA-256 for a digest a user or a
# server gives for a whole file.
ring.workspace = true
thiserror = { workspace = true, features = ["std"] }
tokio.workspace = true
tracing.workspace = true

# The model test of a transfer's shared state swaps in loom's locks. Run it
# with `just loom`.
[target.'cfg(mux_loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
