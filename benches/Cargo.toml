[package]
name = "benches"
description = "Benchmarks for mux: instruction counts for the hot paths, a timed loopback transfer, a timed web download, and a comparison of ways to send only what changed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# docs/performance.md says what each benchmark measures and how to run it.

[dev-dependencies]
blake3.workspace = true
engine.workspace = true
fs.workspace = true
gungraun.workspace = true
model.workspace = true
peer.workspace = true
tempfile.workspace = true
tokio.workspace = true
web.workspace = true

# A safe wrapper around `getrusage`, so the timed benchmarks need no
# `unsafe`.
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

# Counts instructions under Valgrind, so Linux only.
[[bench]]
name = "instructions"
path = "instructions.rs"
harness = false

# Times a transfer over loopback.
[[bench]]
name = "transfer"
path = "transfer.rs"
harness = false

# Compares ways of sending only the changed parts of a file.
[[bench]]
name = "delta"
path = "delta.rs"
harness = false

# Times a download from a web address.
[[bench]]
name = "web"
path = "web.rs"
harness = false

[lints]
workspace = true
