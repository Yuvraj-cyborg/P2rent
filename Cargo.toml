[package]
name = "p2rent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Swarm distribution of large artifacts over QUIC"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yuvraj-cyborg/P2rent"
keywords = ["p2p", "quic", "swarm", "blake3", "file-transfer"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
blake3 = "1.8"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
