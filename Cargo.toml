[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Fuzzing needs a nightly compiler, so the fuzz targets are a workspace of
# their own.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Yuvraj-cyborg/mux"

# One place for every version. A crate asks for a dependency with
# `name.workspace = true`.
[workspace.dependencies]
model = { path = "crates/model", version = "0.2.0" }
fs = { path = "crates/fs", version = "0.2.0" }
peer = { path = "crates/peer", version = "0.2.0", default-features = false }

anyhow = "1"
blake3 = { version = "1.8", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
indicatif = "0.18"
nix = { version = "0.32", default-features = false, features = ["resource"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = "1.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-udp = { version = "0.5", default-features = false }
rayon = "1.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
tempfile = "3"
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
walkdir = "2.5"

# Lints apply to every target of every crate. CI turns warnings into errors, so "warn" here
# means "must be fixed before merging" while keeping local builds going.
[workspace.lints.rust]
# The fast path that needs `unsafe` gets its own crate (see CONTRIBUTING.md).
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }
# `kani` is set by the Kani model checker, `mux_loom` by `just loom`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mux_loom)'] }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Switched off, each for a stated reason:
# Asks for `#[must_use]` on nearly every getter without finding bugs.
must_use_candidate = "allow"
# u64 to f64 is only used to print rates and percentages.
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
