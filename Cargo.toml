[package]
name = "p2rent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Swarm distribution of large artifacts over QUIC"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yuvraj-cyborg/P2rent"
keywords = ["p2p", "quic", "swarm", "blake3", "file-transfer"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
blake3 = "1.8"
dirs = "6"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rayon = "1.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
