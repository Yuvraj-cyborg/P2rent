[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Fuzz targets for everything that parses bytes from other machines"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
model = { path = "../crates/model" }
peer = { path = "../crates/peer", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# This crate is its own workspace, because fuzzing needs a nightly compiler
# and the rest of the project builds on stable.
[workspace]

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ticket"
path = "fuzz_targets/ticket.rs"
test = false
doc = false
bench = false
